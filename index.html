<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="theme-color" content="#0b1120">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jornada">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada de Investimentos - Rico + Nubank + Inter</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b1120;
            --bg-gradient: radial-gradient(circle at 20% 0%, #1e293b 0%, #0b1120 60%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-bg-solid: #1e293b;
            --border: #334155;
            --border-soft: rgba(51, 65, 85, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --input-bg: rgba(15, 23, 42, 0.6);
            --stock-accent: #60a5fa;
            --nubank-accent: #8b5cf6;
            --inter-accent: #f97316;
        }

        * {
            transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px 60px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabeçalho elegante */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            padding: 20px 0 30px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--stock-accent), var(--nubank-accent), var(--inter-accent));
            opacity: 0.9;
        }

        h1 {
            font-size: 2.6em;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 60%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 .dot {
            background: linear-gradient(135deg, var(--accent), var(--stock-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05em;
            margin: 0;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* Config global */
        .global-config {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .global-config label {
            font-size: 0.95em;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .global-config input {
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1em;
            font-weight: 600;
            width: 100px;
            text-align: center;
            outline: none;
        }

        .global-config input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        /* Títulos de seção */
        .section-title {
            font-size: 1.15em;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.01em;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            border-radius: 4px;
            background: var(--accent);
        }

        .section-title.rico-stock::before { background: var(--stock-accent); }
        .section-title.nubank::before { background: var(--nubank-accent); }
        .section-title.inter::before { background: var(--inter-accent); }

        /* Grid de cards */
        .fii-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 45px;
        }

        /* Card refinado */
        .fii-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .fii-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fii-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .fii-card:hover::before {
            opacity: 1;
        }

        .fii-card.stock-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
        }
        .fii-card.stock-card::before { background: var(--stock-accent); }

        .fii-card.nubank-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
        }
        .fii-card.nubank-card::before { background: var(--nubank-accent); }

        .fii-card.inter-card:hover {
            border-color: rgba(249, 115, 22, 0.4);
        }
        .fii-card.inter-card::before { background: var(--inter-accent); }

        /* Cabeçalho do card */
        .fii-header {
            font-size: 1.35em;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-soft);
            letter-spacing: 0.03em;
        }

        .stock-card .fii-header { color: var(--stock-accent); }
        .nubank-card .fii-header { color: var(--nubank-accent); }
        .inter-card .fii-header { color: var(--inter-accent); }

        /* Inputs */
        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95em;
            font-weight: 500;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            background-color: rgba(15, 23, 42, 0.85);
        }

        .stock-card .input-group input:focus {
            border-color: var(--stock-accent);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        .nubank-card .input-group input:focus {
            border-color: var(--nubank-accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .inter-card .input-group input:focus {
            border-color: var(--inter-accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        /* Resultados do card */
        .card-results {
            margin-top: 18px;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(51, 65, 85, 0.4);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.88em;
            margin-bottom: 7px;
            color: var(--text-muted);
        }

        .result-row span:last-child {
            color: var(--text-main);
            font-weight: 600;
        }

        .result-row.total {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--accent);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .result-row.total span:last-child {
            color: var(--accent);
        }

        .stock-card .result-row.total,
        .stock-card .result-row.total span:last-child {
            color: var(--stock-accent);
        }

        .nubank-card .result-row.total,
        .nubank-card .result-row.total span:last-child {
            color: var(--nubank-accent);
        }

        .inter-card .result-row.total,
        .inter-card .result-row.total span:last-child {
            color: var(--inter-accent);
        }

        /* Resumo global */
        .global-summary {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 30px 25px;
            margin-bottom: 35px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1);
        }

        .summary-box .label {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .summary-box .value {
            font-size: 1.7em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
        
        .summary-box .value.green {
            color: var(--accent);
        }

        /* Gráfico */
        .chart-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-soft);
            height: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 600px) {
            body { padding: 15px 10px 40px; }
            h1 { font-size: 1.9em; }
            .global-summary { grid-template-columns: 1fr; }
            .summary-box .value { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Jornada de Investimentos<span class="dot">.</span></h1>
            <p class="subtitle">FIIs e Ações · Rico · Nubank · Inter · Reinvestimento de proventos</p>
        </div>

        <div class="global-config">
            <label for="global-years">Prazo da Projeção (Anos):</label>
            <input type="number" id="global-years" value="10" min="1" step="1" oninput="calculateAll()">
        </div>

        <div class="section-title">🏢 Fundos Imobiliários · Rico</div>
        <div class="fii-grid" id="fii-container"></div>

        <div class="section-title rico-stock">📈 Ações · Rico</div>
        <div class="fii-grid" id="stock-container"></div>

        <div class="section-title nubank">💜 Ações · Nubank</div>
        <div class="fii-grid" id="nubank-container"></div>

        <div class="section-title inter">🧡 Ações · Inter</div>
        <div class="fii-grid" id="inter-container"></div>

        <div class="global-summary">
            <div class="summary-box">
                <div class="label">Total Investido Hoje</div>
                <div class="value" id="global-invested">R$ 0,00</div>
            </div>
            <div class="summary-box">
                <div class="label">Proventos Reinvestidos</div>
                <div class="value green" id="global-yield">+ R$ 0,00</div>
            </div>
            <div class="summary-box">
                <div class="label">Patrimônio Total</div>
                <div class="value green" id="global-patrimony">R$ 0,00</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="portfolioChart"></canvas>
        </div>
    </div>

    <script>
        // ==================== FIIs (Rico) ====================
        const fiis = [
            { id: 'mxrf11', name: 'MXRF11', defaultQty: 100, defaultPrice: 10.00, defaultYield: 12.5, type: 'fii' },
            { id: 'vgir11', name: 'VGIR11', defaultQty: 100, defaultPrice: 10.00, defaultYield: 13.5, type: 'fii' },
            { id: 'btlg11', name: 'BTLG11', defaultQty: 10,  defaultPrice: 100.00, defaultYield: 9.5, type: 'fii' },
            { id: 'visc11', name: 'VISC11', defaultQty: 10,  defaultPrice: 100.00, defaultYield: 8.5, type: 'fii' },
            { id: 'xplg11', name: 'XPLG11', defaultQty: 10,  defaultPrice: 100.00, defaultYield: 9.0, type: 'fii' }
        ];

        // ==================== Ações Rico ====================
        const stocks = [
            { id: 'bbse3', name: 'BBSE3', defaultQty: 100, defaultPrice: 40.00, defaultYield: 11.0, type: 'stock' },
            { id: 'cxse3', name: 'CXSE3', defaultQty: 100, defaultPrice: 20.00, defaultYield: 6.9, type: 'stock' },
            { id: 'itsa3', name: 'ITSA3', defaultQty: 100, defaultPrice: 14.00, defaultYield: 8.6, type: 'stock' }
        ];

        // ==================== Ações Nubank ====================
        const nubankStocks = [
            { id: 'radl3', name: 'RADL3', defaultQty: 100, defaultPrice: 22.00, defaultYield: 1.5, type: 'nubank' },
            { id: 'sapr4', name: 'SAPR4', defaultQty: 100, defaultPrice: 5.50,  defaultYield: 7.0, type: 'nubank' },
            { id: 'wege3', name: 'WEGE3', defaultQty: 100, defaultPrice: 38.00, defaultYield: 1.5, type: 'nubank' },
            { id: 'sbsp3', name: 'SBSP3', defaultQty: 100, defaultPrice: 75.00, defaultYield: 2.5, type: 'nubank' },
            { id: 'recv3', name: 'RECV3', defaultQty: 100, defaultPrice: 18.00, defaultYield: 5.0, type: 'nubank' }
        ];

        // ==================== Ações Inter ====================
        const interStocks = [
            { id: 'petr4', name: 'PETR4', defaultQty: 100, defaultPrice: 38.00, defaultYield: 13.0, type: 'inter' },
            { id: 'egie3', name: 'EGIE3', defaultQty: 100, defaultPrice: 40.00, defaultYield: 7.0,  type: 'inter' },
            { id: 'vale3', name: 'VALE3', defaultQty: 100, defaultPrice: 62.00, defaultYield: 8.0,  type: 'inter' },
            { id: 'itub4', name: 'ITUB4', defaultQty: 100, defaultPrice: 33.00, defaultYield: 6.5,  type: 'inter' },
            { id: 'csmg3', name: 'CSMG3', defaultQty: 100, defaultPrice: 22.00, defaultYield: 6.0,  type: 'inter' },
            { id: 'bbas3', name: 'BBAS3', defaultQty: 100, defaultPrice: 28.00, defaultYield: 9.0,  type: 'inter' },
            { id: 'taee4', name: 'TAEE4', defaultQty: 100, defaultPrice: 12.00, defaultYield: 7.5,  type: 'inter' },
            { id: 'klbn4', name: 'KLBN4', defaultQty: 100, defaultPrice: 4.20,  defaultYield: 5.5,  type: 'inter' },
            { id: 'tims3', name: 'TIMS3', defaultQty: 100, defaultPrice: 16.00, defaultYield: 5.0,  type: 'inter' },
            { id: 'sanb3', name: 'SANB3', defaultQty: 100, defaultPrice: 13.00, defaultYield: 6.0,  type: 'inter' }
        ];

        let chartInstance = null;

        const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatNumber = (val) => val.toLocaleString('pt-BR', { maximumFractionDigits: 2 });

        function renderAssetCards(containerId, assets, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            assets.forEach(asset => {
                let cardClass = 'fii-card';
                if (type === 'stock') cardClass += ' stock-card';
                if (type === 'nubank') cardClass += ' nubank-card';
                if (type === 'inter') cardClass += ' inter-card';

                const cardHTML = `
                    <div class="${cardClass}">
                        <div class="fii-header">${asset.name}</div>
                        
                        <div class="input-group">
                            <label>Quantidade de Cotas que Tenho</label>
                            <input type="number" id="${asset.id}-qty" value="${asset.defaultQty}" min="0" step="1" oninput="calculateAll()">
                        </div>
                        
                        <div class="input-group">
                            <label>Valor da Cota (R$)</label>
                            <input type="number" id="${asset.id}-price" value="${asset.defaultPrice}" min="0" step="0.01" oninput="calculateAll()">
                        </div>
                        
                        <div class="input-group">
                            <label>Yield Anual (%)</label>
                            <input type="number" id="${asset.id}-yield" value="${asset.defaultYield}" min="0" step="0.1" oninput="calculateAll()">
                        </div>

                        <div class="card-results">
                            <div class="result-row">
                                <span>Cotas Totais:</span>
                                <span id="${asset.id}-res-qty">0</span>
                            </div>
                            <div class="result-row">
                                <span>Investido Hoje:</span>
                                <span id="${asset.id}-res-invested">R$ 0,00</span>
                            </div>
                            <div class="result-row">
                                <span>Proventos:</span>
                                <span id="${asset.id}-res-yield">+ R$ 0,00</span>
                            </div>
                            <div class="result-row total">
                                <span>Total:</span>
                                <span id="${asset.id}-res-total">R$ 0,00</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function calculateAll() {
            const years = parseInt(document.getElementById('global-years').value) || 0;
            const maxMonths = years * 12;

            const allAssets = [...fiis, ...stocks, ...nubankStocks, ...interStocks];

            let globalInvested = 0;
            const assetData = [];

            allAssets.forEach(asset => {
                const qty = parseInt(document.getElementById(`${asset.id}-qty`).value) || 0;
                const price = parseFloat(document.getElementById(`${asset.id}-price`).value) || 0;
                const annualYield = parseFloat(document.getElementById(`${asset.id}-yield`).value) || 0;
                
                const monthlyRate = Math.pow(1 + (annualYield / 100), 1/12) - 1;
                const invested = qty * price;

                assetData.push({ 
                    id: asset.id, 
                    qty,
                    price,
                    monthlyRate, 
                    invested
                });
                
                globalInvested += invested;
            });

            let chartLabels = [];
            let chartInvestedData = new Array(maxMonths).fill(0);
            let chartPatrimonyData = new Array(maxMonths).fill(0);

            assetData.forEach(data => {
                let currentPatrimony = data.invested;
                let currentQty = data.qty;

                for (let i = 0; i < maxMonths; i++) {
                    const rendimento = currentPatrimony * data.monthlyRate;
                    const cotasCompradas = data.price > 0 ? rendimento / data.price : 0;
                    currentQty += cotasCompradas;
                    currentPatrimony += rendimento;

                    chartInvestedData[i] += data.invested;
                    chartPatrimonyData[i] += currentPatrimony;

                    if (i === maxMonths - 1) {
                        document.getElementById(`${data.id}-res-qty`).innerText = formatNumber(currentQty);
                        document.getElementById(`${data.id}-res-invested`).innerText = formatCurrency(data.invested);
                        document.getElementById(`${data.id}-res-yield`).innerText = '+' + formatCurrency(currentPatrimony - data.invested);
                        document.getElementById(`${data.id}-res-total`).innerText = formatCurrency(currentPatrimony);
                    }
                }
            });

            for (let i = 1; i <= maxMonths; i++) {
                chartLabels.push(i % 12 === 0 ? `Ano ${i/12}` : `Mês ${i}`);
            }

            const finalInvested = globalInvested;
            const finalPatrimony = maxMonths > 0 ? chartPatrimonyData[maxMonths - 1] : globalInvested;
            const finalYield = finalPatrimony - finalInvested;

            document.getElementById('global-invested').innerText = formatCurrency(finalInvested);
            document.getElementById('global-yield').innerText = '+' + formatCurrency(finalYield);
            document.getElementById('global-patrimony').innerText = formatCurrency(finalPatrimony);

            updateChart(chartLabels, chartInvestedData, chartPatrimonyData);
        }

        function updateChart(labels, investedData, patrimonyData) {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.borderColor = '#334155';
            Chart.defaults.font.family = "'Inter', 'Segoe UI', system-ui, sans-serif";

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Patrimônio Total (R$)',
                            data: patrimonyData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.12)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: '#10b981',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2
                        },
                        {
                            label: 'Total Investido (R$)',
                            data: investedData,
                            borderColor: '#64748b',
                            borderDash: [6, 6],
                            borderWidth: 2,
                            fill: false,
                            tension: 0.35,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: '#64748b',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#f8fafc',
                            bodyColor: '#e2e8f0',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            cornerRadius: 10,
                            titleFont: { size: 13, weight: '600' },
                            bodyFont: { size: 13 },
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatCurrency(context.raw);
                                }
                            }
                        },
                        legend: {
                            labels: { 
                                color: '#e2e8f0',
                                usePointStyle: true,
                                pointStyle: 'circle',
                                padding: 18,
                                font: { size: 12, weight: '500' }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(51, 65, 85, 0.4)' },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 },
                                callback: function(value) { return 'R$ ' + value.toLocaleString('pt-BR'); }
                            }
                        }
                    }
                }
            });
        }

        window.onload = () => {
            renderAssetCards('fii-container', fiis, 'fii');
            renderAssetCards('stock-container', stocks, 'stock');
            renderAssetCards('nubank-container', nubankStocks, 'nubank');
            renderAssetCards('inter-container', interStocks, 'inter');
            calculateAll();
        };
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
